services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "facturation"
      POSTGRES_USER: "facturation"
      POSTGRES_PASSWORD: "facturation"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturation -d facturation"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      PORT: "4000"
      DATABASE_URL: "postgresql://facturation:facturation@db:5432/facturation?schema=public"
      USERNAME: "admin"
      PASSWORD: "changeme"
      NODE_ENV: "development"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4001:4000"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      VITE_PROXY_TARGET: "http://backend:4000"
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres-data:
