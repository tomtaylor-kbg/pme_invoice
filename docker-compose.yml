services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "facturation"
      POSTGRES_USER: "facturation"
      POSTGRES_PASSWORD: "facturation"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturation -d facturation"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
