services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: facturation
      POSTGRES_USER: facturation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facturation_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturation -d facturation"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://facturation:${POSTGRES_PASSWORD:-facturation_dev}@db:5432/facturation?schema=public"
      PORT: "4000"
      NODE_ENV: ${NODE_ENV:-development}
      USERNAME: ${APP_USERNAME:-admin}
      PASSWORD: ${APP_PASSWORD:-changeme}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    volumes:
      - ./apps/backend:/app
      - backend-node-modules:/app/node_modules
    command: ["sh", "-c", "npm run db:migrate && npm start"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: "http://backend:4000"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./apps/frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  postgres-data:
  backend-node-modules:
  frontend-node-modules:
